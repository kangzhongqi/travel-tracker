<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>西语练习 | 句子训练 · 旅行手册 · 学习分析</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--card2:#1c2333;--text:#e6edf3;--text2:#c9d1d9;--muted:#8b949e;--border:#30363d;--accent:#f0883e;--accent2:#d0752a;--green:#3fb950;--red:#f85149;--blue:#58a6ff;--radius:14px;--radius-sm:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.7;padding:12px}
.container{max-width:760px;margin:0 auto}
.header{text-align:center;padding:18px 0 14px}
.header h1{font-size:21px;font-weight:800}.header p{color:var(--muted);font-size:11px}

/* Nav pills */
.nav-row{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;justify-content:center}
.nav-row::-webkit-scrollbar{display:none}
.nav-pill{flex:0 0 auto;padding:7px 14px;text-align:center;font-size:11px;font-weight:600;border-radius:6px;cursor:pointer;background:var(--card);border:1px solid var(--border);color:var(--muted);white-space:nowrap;user-select:none;text-decoration:none}
.nav-pill:hover,.nav-pill.on{border-color:var(--accent);color:var(--accent);background:rgba(240,136,62,.06)}

.tabs{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:8px 12px;text-align:center;font-size:11px;font-weight:600;border-radius:8px;cursor:pointer;background:var(--card);border:1px solid var(--border);color:var(--muted);white-space:nowrap;user-select:none}
.tab.on{background:rgba(240,136,62,.1);border-color:var(--accent);color:var(--accent)}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin:10px 0}
.card h3{font-size:14px;margin-bottom:8px}
.card p{font-size:11px;color:var(--text2);margin-bottom:5px}

.btn{display:inline-flex;align-items:center;gap:3px;padding:7px 16px;border-radius:7px;border:none;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.accent{background:var(--accent);color:#fff}.btn.accent:hover{opacity:.9}
.btn.ghost{background:var(--card);border:1px solid var(--border);color:var(--text2)}
.btn.ghost:hover{background:var(--card2);color:var(--text)}
.btn:active{transform:scale(.97)}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}

/* Special chars bar */
.char-bar{display:flex;gap:3px;flex-wrap:wrap;margin:6px 0;padding:4px 0}
.char-btn{padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:var(--card2);color:var(--text2);font-size:13px;cursor:pointer;font-family:monospace;transition:all .15s}
.char-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(240,136,62,.08)}

/* Sentence box */
.sent-box{background:var(--card2);border-radius:var(--radius-sm);padding:16px;margin:8px 0}
.sent-box .prompt{font-size:13px;margin-bottom:10px;line-height:1.6}
.sent-box .prompt .blank{display:inline-block;min-width:70px;border-bottom:2px dashed var(--accent);margin:0 4px;text-align:center;color:var(--accent);font-weight:600}
.sent-box input,.sent-box textarea{width:100%;padding:9px 12px;font-size:13px;border-radius:7px;background:var(--bg);border:2px solid var(--border);color:var(--text);outline:none;font-family:inherit}
.sent-box input:focus,.sent-box textarea:focus{border-color:var(--accent)}
.sent-box textarea{min-height:55px;resize:vertical}

/* Word chips */
.word-chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0;min-height:36px;padding:6px;border:2px dashed var(--border);border-radius:7px;align-items:flex-start}
.word-chips.empty::after{content:'点击下方单词添加到此处';color:var(--text3);font-size:11px}
.word-chip{display:inline-block;padding:5px 12px;background:var(--accent);color:#fff;border-radius:7px;font-size:12px;cursor:pointer;user-select:none;transition:all .15s}
.word-pool{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.word-pool .word-chip{background:var(--card2);color:var(--text2);border:1px solid var(--border)}

.fb{padding:8px 12px;border-radius:7px;margin-top:6px;font-size:11px;display:none}
.fb.show{display:block}.fb.ok{background:rgba(63,185,80,.08);color:var(--green)}
.fb.err{background:rgba(248,81,73,.08);color:var(--red)}

/* Reading */
.reading-passage{background:var(--card2);border-radius:8px;padding:14px;margin:8px 0;font-size:12px;line-height:1.8}
.q-opt-btn{display:block;width:100%;text-align:left;padding:7px 12px;margin:3px 0;border-radius:7px;border:1px solid var(--border);background:var(--card2);color:var(--text2);font-size:11px;cursor:pointer}
.q-opt-btn:hover{border-color:var(--accent)}
.q-opt-btn.picked{border-color:var(--blue);background:rgba(88,166,255,.1)}
.q-opt-btn.ok{border-color:var(--green);background:rgba(63,185,80,.1)}
.q-opt-btn.bad{border-color:var(--red);background:rgba(248,81,73,.1)}

/* Phrasebook */
.phrase-item{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:7px;margin:3px 0;background:var(--card2);gap:8px}
.phrase-item .es{font-weight:600;font-size:12px;flex:1}.phrase-item .zh{font-size:10px;color:var(--muted)}
.scenario-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin:8px 0}
.scenario-card{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer}
.scenario-card:hover{border-color:var(--accent)}
.scenario-card h4{font-size:12px}.scenario-card .count{font-size:10px;color:var(--text3)}
.scenario-card .icon{font-size:22px;margin-bottom:2px}

/* Daily */
.daily-box{text-align:center;padding:20px}
.daily-es{font-size:20px;font-weight:700;margin:10px 0;line-height:1.5}
.daily-zh{font-size:13px;color:var(--muted);margin-bottom:8px}
.daily-streak{font-size:11px;color:var(--accent);margin:6px 0}

/* Analytics */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0}
.stat-card{background:var(--card2);border-radius:8px;padding:12px;text-align:center}
.stat-card .val{font-size:24px;font-weight:800;color:var(--accent)}
.stat-card .lbl{font-size:10px;color:var(--text3);margin-top:2px}
.stat-card .pct{font-size:13px;font-weight:700}
.stat-card .pct.good{color:var(--green)}.stat-card .pct.ok{color:var(--accent)}.stat-card .pct.bad{color:var(--red)}
.history-list{max-height:300px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;padding:6px 10px;font-size:11px;border-bottom:1px solid var(--border);color:var(--text2)}
.history-item .type{font-weight:600;color:var(--text)}.history-item .score{font-weight:700}

@media(max-width:500px){.daily-es{font-size:17px}}
</style>
</head>
<body>
<div class="container">

<div class="header"><h1>🇪🇸 西语练习</h1>
  <div class="nav-row">
    <a class="nav-pill" href="spanish-verbs.html">动词变位</a>
    <a class="nav-pill" href="spanish-grammar.html">A2 手册</a>
    <a class="nav-pill on" href="spanish-practice.html">练习</a>
  </div>
</div>

<div class="tabs" id="main-tabs">
  <div class="tab on" data-tab="daily">📖 每日一句</div>
  <div class="tab" data-tab="sentences">📝 句子训练</div>
  <div class="tab" data-tab="travel">✈️ 旅行手册</div>
  <div class="tab" data-tab="analytics">📊 学习分析</div>
</div>

<!-- Special characters -->
<div class="char-bar" id="char-bar">
  <span style="font-size:10px;color:var(--text3);margin-right:4px;align-self:center">特殊字符：</span>
</div>

<!-- ===== DAILY ===== -->
<div id="tab-daily">
<div class="card">
  <div class="daily-box">
    <h3>📖 每日一句</h3>
    <div class="daily-streak" id="streak-display"></div>
    <div class="daily-es" id="daily-es"></div>
    <div class="daily-zh" id="daily-zh" style="display:none"></div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn ghost" onclick="dailyReveal()" id="daily-reveal-btn">👁 看翻译</button>
      <button class="btn ghost" onclick="dailyNext()">🔄 换一句</button>
      <button class="btn accent" onclick="dailyDone()">✅ 今日已练</button>
    </div>
  </div>
</div>
</div>

<!-- ===== SENTENCE PRACTICE ===== -->
<div id="tab-sentences" style="display:none">
<div class="btn-row" style="margin-bottom:8px">
  <button class="btn ghost on" data-level="1" id="lvl-btn-1" onclick="setLevel(1)"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:4px"></span>L1 填空</button>
  <button class="btn ghost" data-level="2" id="lvl-btn-2" onclick="setLevel(2)"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:4px"></span>L2 组句</button>
  <button class="btn ghost" data-level="3" id="lvl-btn-3" onclick="setLevel(3)"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:4px"></span>L3 翻译</button>
  <button class="btn ghost" data-level="4" id="lvl-btn-4" onclick="setLevel(4)"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#bc8cff;margin-right:4px"></span>L4 阅读</button>
</div>
<div id="sent-area"></div>
</div>

<!-- ===== TRAVEL ===== -->
<div id="tab-travel" style="display:none">
<div id="travel-scenarios" class="scenario-grid"></div>
<div id="travel-phrases"></div>
</div>

<!-- ===== ANALYTICS ===== -->
<div id="tab-analytics" style="display:none">
<div class="card"><h3>📊 总体数据</h3><div class="stat-grid" id="overall-stats"></div></div>
<div class="card"><h3>📋 按题型分布</h3><div class="stat-grid" id="type-stats"></div></div>
<div class="card"><h3>📜 最近记录</h3><div class="history-list" id="history-list"></div>
<button class="btn ghost" style="margin-top:8px;font-size:10px" onclick="clearHistory()">🗑 清除记录</button></div>
</div>

</div><!-- /container -->

<script>
'use strict';var $=function(id){return document.getElementById(id)};

// ===== SPECIAL CHARS =====
var specialChars=['á','é','í','ó','ú','ü','ñ','Á','É','Í','Ó','Ú','Ü','Ñ','¿','¡','«','»'];
var charHTML='';
specialChars.forEach(function(c){charHTML+='<button class="char-btn" onclick="insertChar(\''+c+'\')">'+c+'</button>'});
$('char-bar').innerHTML='<span style="font-size:10px;color:var(--text3);margin-right:4px;align-self:center">特殊字符：</span>'+charHTML;
function insertChar(c){
  var el=document.activeElement;
  if(el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA')){
    var s=el.selectionStart,e=el.selectionEnd,v=el.value;
    el.value=v.substring(0,s)+c+v.substring(e);el.selectionStart=el.selectionEnd=s+1;el.focus();
  }
}

// ===== NORMALIZE: lenient comparison =====
function norm(s){
  var map={'á':'a','é':'e','í':'i','ó':'o','ú':'u','ü':'u','ñ':'n','Á':'a','É':'e','Í':'i','Ó':'o','Ú':'u','Ü':'u','Ñ':'n'};
  return s.toLowerCase().replace(/[.,!?¿¡:;()"']/g,'').replace(/\s+/g,' ').trim().split('').map(function(c){return map[c]||c}).join('');
}

// ===== TABS =====
document.querySelectorAll('#main-tabs .tab').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('#main-tabs .tab').forEach(function(e){e.classList.remove('on')});
    this.classList.add('on');
    ['daily','sentences','travel','analytics'].forEach(function(id){$('tab-'+id).style.display=(id===this.dataset.tab)?'block':'none'}.bind(this));
    if(this.dataset.tab==='travel')renderScenarios();
    if(this.dataset.tab==='sentences')renderSentence();
    if(this.dataset.tab==='analytics')renderAnalytics();
  });
});

// ===== DAILY =====
var dailyBank=[{es:'¿Qué vas a hacer este fin de semana?',zh:'这个周末你要做什么？'},{es:'Me gusta mucho viajar en tren.',zh:'我很喜欢坐火车旅行。'},{es:'Ayer fui al cine con mis amigos.',zh:'昨天我和朋友们去了电影院。'},{es:'¿Puedes hablar más despacio, por favor?',zh:'请你说慢一点好吗？'},{es:'Cuando era niño, vivía en el campo.',zh:'我小时候住在乡下。'},{es:'Tengo que terminar este trabajo para mañana.',zh:'我必须在明天之前完成这个工作。'},{es:'Si tuviera más tiempo, aprendería otro idioma.',zh:'如果有更多时间，我会再学一门语言。'},{es:'Me encantaría visitar España algún día.',zh:'我很想有一天去西班牙。'},{es:'Hace mucho calor hoy, ¿verdad?',zh:'今天好热，对吧？'},{es:'Llevo tres años estudiando español.',zh:'我学西班牙语三年了。'}];
var dailyIdx=Math.floor(Math.random()*dailyBank.length);
function showDaily(){
  var s=dailyBank[dailyIdx];$('daily-es').textContent=s.es;$('daily-zh').textContent=s.zh;$('daily-zh').style.display='none';$('daily-reveal-btn').textContent='👁 看翻译';
  try{var raw=localStorage.getItem('sp_daily'),d=raw?JSON.parse(raw):{date:'',count:0};var today=new Date().toISOString().slice(0,10);
  $('streak-display').textContent=d.date===today?'🔥 连续 '+d.count+' 天':''}catch(e){}
}
function dailyReveal(){var el=$('daily-zh');if(el.style.display==='none'){el.style.display='block';$('daily-reveal-btn').textContent='🙈 隐藏'}else{el.style.display='none';$('daily-reveal-btn').textContent='👁 看翻译'}}
function dailyNext(){dailyIdx=Math.floor(Math.random()*dailyBank.length);showDaily()}
function dailyDone(){
  try{var raw=localStorage.getItem('sp_daily'),d=raw?JSON.parse(raw):{date:'',count:0};var today=new Date().toISOString().slice(0,10);
  if(d.date===today){d.count++}else{var y=new Date(Date.now()-864e5).toISOString().slice(0,10);d.count=d.date===y?d.count+1:1;d.date=today}
  localStorage.setItem('sp_daily',JSON.stringify(d));$('streak-display').textContent='🔥 连续 '+d.count+' 天！';
  saveRecord('daily',1,1);
  }catch(e){}
}
showDaily();

// ===== TRAVEL =====
var travelData={
  '🍽️ 餐厅':[{es:'¿Me puede traer el menú, por favor?',zh:'请给我菜单'},{es:'Quisiera reservar una mesa para dos.',zh:'我想订一张两人桌'},{es:'¿Cuál es el plato del día?',zh:'今日特色菜是什么？'},{es:'La cuenta, por favor.',zh:'买单'},{es:'¿Tienen opciones vegetarianas?',zh:'有素食选择吗？'},{es:'Quiero esto, por favor.',zh:'我要这个'},{es:'Está delicioso.',zh:'很好吃'},{es:'¿Me puede traer más pan?',zh:'能再给我一些面包吗？'}],
  '🏨 酒店':[{es:'Tengo una reserva a nombre de...',zh:'我有一个预订，名字是…'},{es:'¿A qué hora es el check-in?',zh:'几点入住？'},{es:'¿Hay wifi gratis?',zh:'有免费 wifi 吗？'},{es:'¿Está incluido el desayuno?',zh:'含早餐吗？'},{es:'¿Me puede dar otra toalla?',zh:'能再给我一条毛巾吗？'},{es:'Voy a salir. ¿Me guarda la llave?',zh:'我要出去，能帮我保管钥匙吗？'},{es:'¿A qué hora tengo que dejar la habitación?',zh:'几点退房？'},{es:'El aire acondicionado no funciona.',zh:'空调坏了'}],
  '✈️ 交通':[{es:'¿Dónde está la puerta de embarque?',zh:'登机口在哪？'},{es:'Quisiera cambiar mi billete.',zh:'我想改签'},{es:'¿A qué hora sale el próximo tren?',zh:'下一班火车几点？'},{es:'¿Cuánto cuesta un billete de ida?',zh:'单程票多少钱？'},{es:'¿Dónde puedo tomar un taxi?',zh:'哪里可以打车？'},{es:'He perdido mi equipaje.',zh:'我丢了行李'},{es:'¿Este autobús va al centro?',zh:'这趟公交去市中心吗？'},{es:'¿Cuánto tiempo tarda en llegar?',zh:'需要多长时间到达？'}],
  '🛒 购物':[{es:'¿Cuánto cuesta esto?',zh:'这个多少钱？'},{es:'¿Me lo puedo probar?',zh:'我可以试一下吗？'},{es:'¿Tiene una talla más pequeña?',zh:'有小一号的吗？'},{es:'Solo estoy mirando, gracias.',zh:'我只是看看，谢谢'},{es:'Me lo llevo.',zh:'我要了'},{es:'¿Aceptan tarjeta de crédito?',zh:'可以刷卡吗？'},{es:'¿Me puede hacer un descuento?',zh:'能打折吗？'},{es:'¿Tienen esto en otro color?',zh:'有其他颜色吗？'}],
  '🏥 紧急':[{es:'Necesito un médico.',zh:'我需要医生'},{es:'¿Dónde está la farmacia más cercana?',zh:'最近的药房在哪？'},{es:'Me duele aquí.',zh:'我这里疼'},{es:'¿Habla inglés o chino?',zh:'你会说英语或中文吗？'},{es:'Llame a una ambulancia, por favor.',zh:'请叫救护车'},{es:'Me han robado el bolso.',zh:'我的包被偷了'},{es:'¿Dónde está la comisaría?',zh:'警察局在哪？'},{es:'Soy alérgico a...',zh:'我对…过敏'}],
  '👋 社交':[{es:'Mucho gusto.',zh:'很高兴认识你'},{es:'¿Cómo estás?',zh:'你好吗？'},{es:'¿De dónde eres?',zh:'你是哪里人？'},{es:'¿Qué te gusta hacer en tu tiempo libre?',zh:'你空闲时间喜欢做什么？'},{es:'Lo siento.',zh:'对不起'},{es:'No te preocupes.',zh:'没关系'},{es:'¡Qué bonito!',zh:'好漂亮！'},{es:'¿Nos tomamos un café?',zh:'一起喝杯咖啡？'}],
};
function renderScenarios(){
  var h='';
  for(var name in travelData){h+='<div class="scenario-card" onclick="showPhrases(\''+name+'\')"><div class="icon">'+name.slice(0,2)+'</div><h4>'+name.slice(3)+'</h4><div class="count">'+travelData[name].length+' 句</div></div>'}
  $('travel-scenarios').innerHTML=h;$('travel-phrases').innerHTML='';
}
function showPhrases(name){
  var phrases=travelData[name]||[],h='<div class="card"><h3>'+name+'</h3><button class="btn ghost" style="margin-bottom:8px;font-size:10px" onclick="renderScenarios()">↩ 返回</button><button class="btn accent" style="margin-left:6px;font-size:10px" onclick="startTravelQuiz(\''+name+'\')">🧪 小测</button>';
  phrases.forEach(function(p){h+='<div class="phrase-item"><span class="es">'+p.es+'</span><span class="zh">'+p.zh+'</span></div>'});
  h+='</div>';$('travel-phrases').innerHTML=h;
}
var tqState=null;
function startTravelQuiz(name){var p=travelData[name]||[],it=p.slice();for(var i=it.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=it[i];it[i]=it[j];it[j]=t;}it=it.slice(0,4);tqState={items:it,picked:{}};var h='<div class="card"><h3>🧪 '+name+' 小测</h3><p style="font-size:11px;color:var(--text3)">看中文选西语</p>';it.forEach(function(q,qi){var w=p.filter(function(x){return x.es!==q.es});for(var i2=w.length-1;i2>0;i2--){var j2=Math.floor(Math.random()*(i2+1));var t2=w[i2];w[i2]=w[j2];w[j2]=t2;}var o=w.slice(0,3).map(function(x){return x.es});o.push(q.es);for(var i3=o.length-1;i3>0;i3--){var j3=Math.floor(Math.random()*(i3+1));var t3=o[i3];o[i3]=o[j3];o[j3]=t3;}q.qo=o;q.qa=o.indexOf(q.es);h+='<div class="sent-box"><div class="prompt">🇨🇳 <b>'+q.zh+'</b></div><div class="btn-row">'+o.map(function(opt,oi){return '<button class="btn ghost" style="font-size:11px" id="tq-'+qi+'-'+oi+'" onclick="pickTQ('+qi+','+oi+')">'+opt+'</button>'}).join('')+'</div><div class="fb" id="tqfb-'+qi+'"></div></div>'});h+='<div class="btn-row"><button class="btn accent" onclick="checkTQ()">✅ 检查</button><button class="btn ghost" onclick="showPhrases(\''+name+'\')">↩ 返回</button></div></div>';$('travel-phrases').innerHTML=h}
function pickTQ(qi,oi){var s=tqState;if(!s||s.picked[qi]!==undefined)return;s.picked[qi]=oi;var a=s.items[qi].qa;document.querySelectorAll('#tq-'+qi+'-'+oi).forEach(function(b){b.classList.add('picked')});if(oi===a){document.getElementById('tq-'+qi+'-'+oi).classList.add('ok')}else{document.getElementById('tq-'+qi+'-'+oi).classList.add('bad');document.getElementById('tq-'+qi+'-'+a).classList.add('ok')}document.getElementById('tqfb-'+qi).className='fb show ok';document.getElementById('tqfb-'+qi).textContent='✅ '+s.items[qi].es+' = '+s.items[qi].zh}
function checkTQ(){var s=tqState;if(!s)return;var c=0;s.items.forEach(function(q,qi){if(s.picked[qi]===q.qa)c++;else{document.getElementById('tqfb-'+qi).className='fb show err';document.getElementById('tqfb-'+qi).textContent='❌ '+q.es+' = '+q.zh}});saveRecord('旅行手册',c===s.items.length?1:0,1);alert('得分：'+c+'/'+s.items.length)}
renderScenarios();

// ===== SENTENCE PRACTICE =====
var sentLevel=1,sentCorrect=0,sentTotal=0;
// Quick start recommendation
(function(){try{var r=localStorage.getItem("sp_history"),h=JSON.parse(r),t={};h.forEach(function(x){if(!t[x.type])t[x.type]={c:0,n:0};t[x.type].n++;if(x.correct===x.total)t[x.type].c++});var w=null,wp=100;for(var k in t){var p=Math.round(t[k].c/t[k].n*100);if(p<wp){wp=p;w=k}}var l=w?parseInt(w.charAt(1)):1;var lb={1:"L1填空",2:"L2组句",3:"L3翻译",4:"L4阅读"};var qr=document.getElementById("quick-start-row");if(qr)qr.innerHTML=w?"<button class=\"btn accent\" onclick=\"document.querySelector('#main-tabs [data-tab=sentences]').click();setLevel("+l+")\" style=\"font-size:11px\">🎯 建议："+lb[l]+"（正确率"+wp+"%）</button>":"<button class=\"btn accent\" onclick=\"document.querySelector('#main-tabs [data-tab=sentences]').click();setLevel(1)\" style=\"font-size:11px\">🎯 开始练习</button>"}catch(e){}})();

var currentItems=[];

function setLevel(l){
  sentLevel=l;
  [1,2,3,4].forEach(function(i){var b=$('lvl-btn-'+i);b.classList.toggle('on',i===l)});
  renderSentence();
}
function renderSentence(){
  var bank=sentenceBank[sentLevel]||[],items=bank.slice();
  for(var i=items.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=items[i];items[i]=items[j];items[j]=t;}
  currentItems=items.slice(0,sentLevel===4?1:3);
  var h='';
  currentItems.forEach(function(item,idx){
    if(sentLevel===1){
      var parts=item.q.split('___');
      h+='<div class="sent-box" id="sq-'+idx+'"><div class="prompt">'+parts[0]+'<span class="blank" id="blank-'+idx+'">______</span>'+parts[1]+'</div><input type="text" id="sinput-'+idx+'" placeholder="输入动词变位..." onkeydown="if(event.key===\'Enter\')checkSent('+idx+')"><div class="fb" id="sfb-'+idx+'"></div><div class="btn-row"><button class="btn accent" onclick="checkSent('+idx+')">✅ 检查</button></div></div>';
    }else if(sentLevel===2){
      h+='<div class="sent-box" id="sq-'+idx+'"><div class="prompt">🇨🇳 '+item.q+'</div><div class="word-chips empty" id="chips-'+idx+'"></div><div class="word-pool" id="pool-'+idx+'"></div><div class="fb" id="sfb-'+idx+'"></div><div class="btn-row"><button class="btn accent" onclick="checkSent('+idx+')">✅ 检查</button><button class="btn ghost" onclick="undoWords('+idx+')">↩ 撤销</button></div></div>';
    }else if(sentLevel===3){
      h+='<div class="sent-box" id="sq-'+idx+'"><div class="prompt">🇨🇳 '+item.q+'</div><textarea id="sinput-'+idx+'" placeholder="输入西班牙语翻译..."></textarea><div class="fb" id="sfb-'+idx+'"></div><div class="btn-row"><button class="btn accent" onclick="checkSent('+idx+')">✅ 检查</button></div></div>';
    }else if(sentLevel===4){
      h+='<div class="sent-box" id="sq-'+idx+'"><h4 style="margin-bottom:8px">📖 阅读理解</h4><div class="reading-passage">'+item.text+'</div>';
      item.qs.forEach(function(q,qi){
        h+='<div style="margin:8px 0"><p style="font-size:12px;font-weight:600;margin-bottom:3px">'+(qi+1)+'. '+q.q+'</p>';
        q.opts.forEach(function(o,oi){h+='<button class="q-opt-btn" id="ropt-'+idx+'-'+qi+'-'+oi+'" onclick="pickROpt('+idx+','+qi+','+oi+')">'+o+'</button>'});
        h+='</div>';
      });
      h+='<div class="fb" id="sfb-'+idx+'"></div><div class="btn-row"><button class="btn accent" onclick="checkReading('+idx+')">✅ 检查</button></div></div>';
    }
  });
  $('sent-area').innerHTML=h;
  // Init word order AFTER DOM is ready
  if(sentLevel===2){currentItems.forEach(function(item,idx){initWordOrder(idx,item)})}
  $('char-bar').style.display=(sentLevel===1||sentLevel===3)?'flex':'none';
}

// Word ordering
var wordState={};
function initWordOrder(idx,item){
  var pool=item.words.slice();
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
  wordState[idx]={pool:pool,chips:[],ans:item.ans};
  updateWordUI(idx);
}
function updateWordUI(idx){
  var st=wordState[idx];if(!st)return;
  $('chips-'+idx).innerHTML=st.chips.length?st.chips.map(function(w,i){return '<span class="word-chip" onclick="removeWord('+idx+','+i+')">'+w+'</span>'}).join(''):'';
  if(!st.chips.length)$('chips-'+idx).classList.add('empty');else $('chips-'+idx).classList.remove('empty');
  $('pool-'+idx).innerHTML=st.pool.map(function(w,i){return '<span class="word-chip" onclick="addWord('+idx+','+i+')">'+w+'</span>'}).join('');
}
function addWord(idx,pi){var st=wordState[idx];if(!st)return;st.chips.push(st.pool[pi]);st.pool.splice(pi,1);updateWordUI(idx)}
function removeWord(idx,ci){var st=wordState[idx];if(!st)return;st.pool.push(st.chips[ci]);st.chips.splice(ci,1);updateWordUI(idx)}
function undoWords(idx){var st=wordState[idx];if(!st)return;while(st.chips.length)st.pool.push(st.chips.pop());updateWordUI(idx)}

// Reading state
var readingPicked={};
function pickROpt(idx,qi,oi){
  if(!readingPicked[idx])readingPicked[idx]={};
  if(readingPicked[idx][qi]!==undefined)return;
  readingPicked[idx][qi]=oi;
  document.querySelectorAll('#ropt-'+idx+'-'+qi+'-'+oi).forEach(function(b){b.classList.add('picked')});
}

// Check answers
function checkSent(idx){
  var item=currentItems[idx];if(!item)return;var fb=$('sfb-'+idx);sentTotal++;
  if(sentLevel===1){
    var input=$('sinput-'+idx)?$('sinput-'+idx).value:'';var ok=norm(input)===norm(item.ans);
    if(ok){fb.className='fb show ok';fb.textContent='✅ 正确！'+item.hint;sentCorrect++}else{fb.className='fb show err';fb.textContent='❌ 正确答案：'+item.ans+' — '+item.hint}
    saveRecord('L1填空',ok?1:0,1);
  }else if(sentLevel===2){
    var built=wordState[idx]?wordState[idx].chips.join(' '):'';
    var ok=norm(built)===norm(item.ans);
    if(ok){fb.className='fb show ok';fb.textContent='✅ 正确！';sentCorrect++}else{fb.className='fb show err';fb.textContent='❌ 正确答案：'+item.ans}
    saveRecord('L2组句',ok?1:0,1);
  }else if(sentLevel===3){
    var input=$('sinput-'+idx)?$('sinput-'+idx).value:'';var ok=norm(input)===norm(item.ans);
    if(ok){fb.className='fb show ok';fb.textContent='✅ 正确！';sentCorrect++}else{fb.className='fb show err';fb.textContent='❌ 参考答案：'+item.ans+' — '+item.hint}
    saveRecord('L3翻译',ok?1:0,1);
  }
}
function checkReading(idx){
  var item=currentItems[idx];if(!item)return;var fb=$('sfb-'+idx),score=0;
  item.qs.forEach(function(q,qi){if(readingPicked[idx]&&readingPicked[idx][qi]===q.ans)score++;document.querySelectorAll('#ropt-'+idx+'-'+qi+'-'+q.ans).forEach(function(b){b.classList.add('ok')})});
  sentTotal++;var ok=score===item.qs.length;if(ok)sentCorrect++;
  fb.className='fb show '+(ok?'ok':'err');fb.textContent=score+'/'+item.qs.length+' 正确'+(ok?' ✅':'');
  saveRecord('L4阅读',ok?1:0,1);
}

// ===== HISTORY SYSTEM =====
function saveRecord(type,correct,total){
  try{
    var raw=localStorage.getItem('sp_history'),h=raw?JSON.parse(raw):[];
    h.push({type:type,correct:correct,total:total,ts:new Date().toISOString()});
    if(h.length>200)h=h.slice(-200);
    localStorage.setItem('sp_history',JSON.stringify(h));
  }catch(e){}
}
function renderAnalytics(){
  try{
    var raw=localStorage.getItem('sp_history'),h=raw?JSON.parse(raw):[];
  }catch(e){var h=[]}

  // Overall
  var total=h.length,correct=h.filter(function(x){return x.correct===x.total}).length;
  var pct=total>0?Math.round(correct/total*100):0,cls=pct>=80?'good':pct>=50?'ok':'bad';
  $('overall-stats').innerHTML='<div class="stat-card"><div class="val">'+total+'</div><div class="lbl">总练习数</div></div><div class="stat-card"><div class="pct '+cls+'">'+pct+'%</div><div class="lbl">总体正确率</div></div><div class="stat-card"><div class="val">'+correct+'</div><div class="lbl">全对次数</div></div>';

  // Per type
  var types={},typeH='';
  h.forEach(function(x){if(!types[x.type])types[x.type]={t:0,c:0};types[x.type].t++;if(x.correct===x.total)types[x.type].c++});
  for(var t in types){
    var tp=Math.round(types[t].c/types[t].t*100),tcls=tp>=80?'good':tp>=50?'ok':'bad';
    var icon=t.indexOf('L1')>=0?'🟢':t.indexOf('L2')>=0?'🟠':t.indexOf('L3')>=0?'🔴':t.indexOf('L4')>=0?'🟣':'📖';
    typeH+='<div class="stat-card"><div class="lbl">'+icon+' '+t+'</div><div class="pct '+tcls+'">'+tp+'%</div><div class="lbl">'+types[t].c+'/'+types[t].t+' 全对</div></div>';
  }
  $('type-stats').innerHTML=typeH||'<div class="stat-card"><div class="lbl">暂无数据</div></div>';

  // Recent history
  var recent=h.slice(-30).reverse(),listH='';
  if(!recent.length)listH='<div style="text-align:center;color:var(--text3);padding:20px;font-size:12px">暂无练习记录</div>';
  recent.forEach(function(x){
    var d=new Date(x.ts),ds=d.toLocaleDateString('zh-CN')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    var ok=x.correct===x.total;
    listH+='<div class="history-item"><span class="type">'+x.type+'</span><span style="font-size:10px;color:var(--text3)">'+ds+'</span><span class="score" style="color:'+(ok?'var(--green)':'var(--red)')+'">'+(ok?'✅':'❌')+'</span></div>';
  });
  $('history-list').innerHTML=listH;
}
function clearHistory(){if(confirm('清除所有练习记录？')){localStorage.removeItem('sp_history');renderAnalytics()}}

setLevel(1);
</script>

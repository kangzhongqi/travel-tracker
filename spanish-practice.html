<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>西语练习 | 每日一句 · 旅行手册 · 句子训练</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--card2:#1c2333;--text:#e6edf3;--text2:#c9d1d9;--muted:#8b949e;--border:#30363d;--accent:#f0883e;--accent2:#d0752a;--green:#3fb950;--red:#f85149;--blue:#58a6ff;--radius:14px;--radius-sm:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.7;padding:14px;-webkit-tap-highlight-color:transparent}
.container{max-width:720px;margin:0 auto}
.header{text-align:center;padding:20px 0 16px}
.header h1{font-size:22px;font-weight:800}.header p{color:var(--muted);font-size:12px;margin-top:2px}
.tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:9px 12px;text-align:center;font-size:12px;font-weight:600;border-radius:8px;cursor:pointer;background:var(--card);border:1px solid var(--border);color:var(--muted);transition:all .15s;white-space:nowrap;user-select:none}
.tab.on{background:rgba(240,136,62,.1);border-color:var(--accent);color:var(--accent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin:12px 0}
.card h3{font-size:15px;margin-bottom:10px}
.card p{font-size:12px;color:var(--text2);margin-bottom:6px}

.btn{display:inline-flex;align-items:center;gap:4px;padding:8px 18px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.btn.accent{background:var(--accent);color:#fff}.btn.accent:hover{opacity:.9}
.btn.ghost{background:var(--card);border:1px solid var(--border);color:var(--text2)}
.btn.ghost:hover{background:var(--card2);color:var(--text)}
.btn:active{transform:scale(.97)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn:disabled{opacity:.5;pointer-events:none}

/* Daily sentence */
.daily-sentence{font-size:22px;font-weight:700;text-align:center;margin:16px 0;line-height:1.5}
.daily-translation{font-size:14px;color:var(--muted);text-align:center;margin-bottom:12px}
.daily-streak{text-align:center;font-size:11px;color:var(--accent);margin:8px 0}

/* Travel phrasebook */
.scenario-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:10px 0}
.scenario-card{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;cursor:pointer;transition:all .15s}
.scenario-card:hover{border-color:var(--accent)}
.scenario-card .icon{font-size:24px;margin-bottom:4px}
.scenario-card h4{font-size:13px;margin-bottom:2px}
.scenario-card .count{font-size:10px;color:var(--text3)}
.phrase-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;margin:4px 0;background:var(--card2);gap:10px}
.phrase-item .es{font-weight:600;font-size:13px;flex:1}
.phrase-item .zh{font-size:11px;color:var(--muted)}
.phrase-item .play-btn{flex-shrink:0;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:14px}
.phrase-item .play-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Sentence practice */
.level-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;margin-right:6px}
.level-badge.l1{background:rgba(63,185,80,.12);color:var(--green)}
.level-badge.l2{background:rgba(240,136,62,.12);color:var(--accent)}
.level-badge.l3{background:rgba(248,81,73,.12);color:var(--red)}
.level-badge.l4{background:rgba(188,140,255,.12);color:#bc8cff}

.sentence-box{background:var(--card2);border-radius:var(--radius-sm);padding:18px;margin:10px 0}
.sentence-box .prompt{font-size:14px;margin-bottom:12px;line-height:1.6}
.sentence-box .prompt .blank{display:inline-block;min-width:80px;border-bottom:2px dashed var(--accent);margin:0 4px;text-align:center;color:var(--accent);font-weight:600}
.sentence-box input{width:100%;padding:10px 14px;font-size:14px;border-radius:8px;background:var(--bg);border:2px solid var(--border);color:var(--text);outline:none;font-family:inherit}
.sentence-box input:focus{border-color:var(--accent)}
.sentence-box textarea{width:100%;padding:10px 14px;font-size:13px;border-radius:8px;background:var(--bg);border:2px solid var(--border);color:var(--text);outline:none;font-family:inherit;resize:vertical;min-height:60px}
.sentence-box textarea:focus{border-color:var(--accent)}

/* Word chips for reorder */
.word-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;min-height:40px;padding:8px;border:2px dashed var(--border);border-radius:8px}
.word-chips.done{border-color:var(--green)}
.word-chip{display:inline-block;padding:6px 14px;background:var(--accent);color:#fff;border-radius:8px;font-size:13px;cursor:pointer;user-select:none;transition:all .15s}
.word-chip:hover{opacity:.8}
.word-pool{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.word-pool .word-chip{background:var(--card2);color:var(--text2);border:1px solid var(--border)}

.feedback{padding:8px 12px;border-radius:8px;margin-top:8px;font-size:12px;display:none}
.feedback.show{display:block}
.feedback.ok{background:rgba(63,185,80,.08);color:var(--green)}
.feedback.err{background:rgba(248,81,73,.08);color:var(--red)}

.score-row{display:flex;justify-content:center;gap:20px;margin:12px 0}
.score-item{text-align:center}
.score-item .num{font-size:28px;font-weight:800;color:var(--accent)}
.score-item .lbl{font-size:10px;color:var(--text3)}

/* Reading passage */
.reading-passage{background:var(--card2);border-radius:var(--radius-sm);padding:16px;margin:10px 0;font-size:13px;line-height:1.8}
.reading-passage .highlight{background:rgba(240,136,62,.15);padding:1px 4px;border-radius:3px}

.q-opt-btn{display:block;width:100%;text-align:left;padding:8px 14px;margin:4px 0;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s}
.q-opt-btn:hover{border-color:var(--accent)}
.q-opt-btn.picked{border-color:var(--blue);background:rgba(88,166,255,.1)}
.q-opt-btn.ok{border-color:var(--green);background:rgba(63,185,80,.1)}
.q-opt-btn.bad{border-color:var(--red);background:rgba(248,81,73,.1)}

@media(max-width:500px){.daily-sentence{font-size:18px}.card{padding:14px}}
</style>
</head>
<body>
<div class="container">

<div class="header"><h1>🇪🇸 西语练习</h1><p>每日一句 · 旅行手册 · 渐进式句子训练</p></div>

<div class="tabs" id="main-tabs">
  <div class="tab on" data-tab="daily">📖 每日一句</div>
  <div class="tab" data-tab="travel">✈️ 旅行手册</div>
  <div class="tab" data-tab="sentences">📝 句子训练</div>
</div>

<!-- ===== DAILY SENTENCE ===== -->
<div id="tab-daily">
<div class="card" style="text-align:center">
  <h3>📖 每日一句</h3>
  <div class="daily-streak" id="streak-display"></div>
  <div class="daily-sentence" id="daily-es"></div>
  <div class="daily-translation" id="daily-zh" style="display:none"></div>
  <div class="btn-row" style="justify-content:center">
    <button class="btn" onclick="dailyListen()">🔊 听发音</button>
    <button class="btn ghost" onclick="dailyReveal()" id="daily-reveal-btn">👁 看翻译</button>
    <button class="btn ghost" onclick="dailyNext()">🔄 换一句</button>
  </div>
  <div class="btn-row" style="justify-content:center;margin-top:4px">
    <button class="btn accent" id="daily-speak-btn" onclick="dailySpeak()">🎤 跟读并打分</button>
    <button class="btn ghost" onclick="dailyDone()">✅ 今日已练</button>
  </div>
  <div id="daily-speak-fb" style="margin-top:8px;font-size:12px;min-height:20px"></div>
  <div style="margin-top:12px;font-size:10px;color:var(--text3)">
    <p>跟读功能需要 Chrome 浏览器 + 允许麦克风权限</p>
  </div>
</div>
</div>

<!-- ===== TRAVEL PHRASEBOOK ===== -->
<div id="tab-travel" style="display:none">
<div id="travel-scenarios" class="scenario-grid"></div>
<div id="travel-phrases"></div>
</div>

<!-- ===== SENTENCE PRACTICE ===== -->
<div id="tab-sentences" style="display:none">
<div class="btn-row" style="margin-bottom:10px">
  <button class="btn ghost on" data-level="1" id="lvl-btn-1" onclick="setLevel(1)"><span class="level-badge l1">L1</span> 填空</button>
  <button class="btn ghost" data-level="2" id="lvl-btn-2" onclick="setLevel(2)"><span class="level-badge l2">L2</span> 组句</button>
  <button class="btn ghost" data-level="3" id="lvl-btn-3" onclick="setLevel(3)"><span class="level-badge l3">L3</span> 翻译</button>
  <button class="btn ghost" data-level="4" id="lvl-btn-4" onclick="setLevel(4)"><span class="level-badge l4">L4</span> 阅读</button>
</div>
<div class="score-row">
  <div class="score-item"><div class="num" id="sent-score">0</div><div class="lbl">今日完成</div></div>
  <div class="score-item"><div class="num" id="sent-correct">0</div><div class="lbl">正确</div></div>
</div>
<div id="sent-area"></div>
</div>

</div><!-- /container -->

<script>
'use strict';var $=function(id){return document.getElementById(id)};

// ===== TTS =====
function speak(text){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=0.85;
  var voices=window.speechSynthesis.getVoices(),es=voices.find(function(v){return v.lang.startsWith('es')});
  if(es)u.voice=es;
  window.speechSynthesis.speak(u);
}

// ===== TABS =====
document.querySelectorAll('#main-tabs .tab').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('#main-tabs .tab').forEach(function(e){e.classList.remove('on')});
    this.classList.add('on');
    ['daily','travel','sentences'].forEach(function(id){$('tab-'+id).style.display=(id===this.dataset.tab)?'block':'none'}.bind(this));
    if(this.dataset.tab==='travel')renderScenarios();
    if(this.dataset.tab==='sentences')renderSentence();
  });
});

// ===== DAILY SENTENCE =====
var dailyBank=[
  {es:'¿Qué vas a hacer este fin de semana?',zh:'这个周末你要做什么？'},
  {es:'Me gusta mucho viajar en tren.',zh:'我很喜欢坐火车旅行。'},
  {es:'Ayer fui al cine con mis amigos.',zh:'昨天我和朋友们去了电影院。'},
  {es:'¿Puedes hablar más despacio, por favor?',zh:'请你说慢一点好吗？'},
  {es:'Cuando era niño, vivía en el campo.',zh:'我小时候住在乡下。'},
  {es:'Tengo que terminar este trabajo para mañana.',zh:'我必须在明天之前完成这个工作。'},
  {es:'Si tuviera más tiempo, aprendería otro idioma.',zh:'如果有更多时间，我会再学一门语言。'},
  {es:'No sé si voy a poder ir a la fiesta.',zh:'我不知道能不能去派对。'},
  {es:'Me encantaría visitar España algún día.',zh:'我很想有一天去西班牙。'},
  {es:'Hace mucho calor hoy, ¿verdad?',zh:'今天好热，对吧？'},
  {es:'¿Dónde está la estación de tren más cercana?',zh:'最近的火车站在哪里？'},
  {es:'Perdón, no te había visto.',zh:'抱歉，我刚才没看到你。'},
  {es:'Ojalá que mañana haga buen tiempo.',zh:'但愿明天天气好。'},
  {es:'Llevo tres años estudiando español.',zh:'我学西班牙语三年了。'},
  {es:'Me lo pasé muy bien en la playa.',zh:'我在海滩玩得很开心。'},
];
var dailyIdx=Math.floor(Math.random()*dailyBank.length);
function showDaily(){
  var s=dailyBank[dailyIdx];
  $('daily-es').textContent=s.es;$('daily-zh').textContent=s.zh;$('daily-zh').style.display='none';
  $('daily-reveal-btn').textContent='👁 看翻译';$('daily-speak-fb').textContent='';
  // Streak
  try{var raw=localStorage.getItem('daily_streak'),d=raw?JSON.parse(raw):{date:'',count:0};
  var today=new Date().toISOString().slice(0,10);
  $('streak-display').textContent=d.date===today?'🔥 连续 '+d.count+' 天':(d.date?'上次练习：'+d.date:'');
  }catch(e){}
}
function dailyListen(){var s=dailyBank[dailyIdx];speak(s.es)}
function dailyReveal(){
  var el=$('daily-zh');
  if(el.style.display==='none'){el.style.display='block';$('daily-reveal-btn').textContent='🙈 隐藏翻译'}
  else{el.style.display='none';$('daily-reveal-btn').textContent='👁 看翻译'}
}
function dailyNext(){dailyIdx=Math.floor(Math.random()*dailyBank.length);showDaily()}
function dailySpeak(){
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){$('daily-speak-fb').textContent='⚠️ 需要 Chrome 浏览器';return}
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=new SR();
  rec.lang='es-ES';rec.interimResults=false;
  $('daily-speak-btn').textContent='🔴 正在听...';$('daily-speak-btn').disabled=true;
  rec.start();
  rec.onresult=function(e){
    var spoken=e.results[0][0].transcript.trim(),target=dailyBank[dailyIdx].es.replace(/[¿?¡!.,]/g,'').trim();
    var match=spoken.toLowerCase()===target.toLowerCase();
    $('daily-speak-fb').innerHTML=match?'<span style="color:var(--green)">✅ 完美！发音准确 — 系统听到：「'+spoken+'」</span>'
      :'<span style="color:var(--accent)">🔊 系统听到：「'+spoken+'」<br>📝 原句：「'+target+'」<br><span style="color:var(--text3)">点 🔈 再听一遍然后重试</span></span>';
  };
  rec.onerror=function(e){$('daily-speak-fb').innerHTML='<span style="color:var(--red)">❌ '+e.error+' — 请检查麦克风权限</span>'};
  rec.onend=function(){$('daily-speak-btn').textContent='🎤 跟读并打分';$('daily-speak-btn').disabled=false};
}
function dailyDone(){
  try{var raw=localStorage.getItem('daily_streak'),d=raw?JSON.parse(raw):{date:'',count:0};
  var today=new Date().toISOString().slice(0,10);
  if(d.date===today){d.count++}else{var yesterday=new Date(Date.now()-864e5).toISOString().slice(0,10);
    d.count=d.date===yesterday?d.count+1:1;d.date=today}
  localStorage.setItem('daily_streak',JSON.stringify(d));
  $('streak-display').textContent='🔥 连续 '+d.count+' 天！';
  }catch(e){}
}
showDaily();

// ===== TRAVEL PHRASEBOOK =====
var travelData={
  '🍽️ 餐厅':[
    {es:'¿Me puede traer el menú, por favor?',zh:'请给我菜单'},
    {es:'Quisiera reservar una mesa para dos.',zh:'我想订一张两人桌'},
    {es:'¿Cuál es el plato del día?',zh:'今日特色菜是什么？'},
    {es:'La cuenta, por favor.',zh:'买单'},
    {es:'¿Tienen opciones vegetarianas?',zh:'有素食选择吗？'},
    {es:'Quiero esto, por favor.',zh:'我要这个'},
    {es:'Está muy rico. / Está delicioso.',zh:'很好吃'},
    {es:'¿Me puede traer más pan?',zh:'能再给我一些面包吗？'},
  ],
  '🏨 酒店':[
    {es:'Tengo una reserva a nombre de...',zh:'我有一个预订，名字是…'},
    {es:'¿A qué hora es el check-in?',zh:'几点入住？'},
    {es:'¿Hay wifi gratis?',zh:'有免费 wifi 吗？'},
    {es:'¿Está incluido el desayuno?',zh:'含早餐吗？'},
    {es:'¿Me puede dar otra toalla?',zh:'能再给我一条毛巾吗？'},
    {es:'Voy a salir. ¿Me guarda la llave?',zh:'我要出去，能帮我保管钥匙吗？'},
    {es:'¿A qué hora tengo que dejar la habitación?',zh:'几点退房？'},
    {es:'El aire acondicionado no funciona.',zh:'空调坏了'},
  ],
  '✈️ 机场/交通':[
    {es:'¿Dónde está la puerta de embarque?',zh:'登机口在哪？'},
    {es:'Quisiera cambiar mi billete.',zh:'我想改签'},
    {es:'¿A qué hora sale el próximo tren?',zh:'下一班火车几点？'},
    {es:'¿Cuánto cuesta un billete de ida?',zh:'单程票多少钱？'},
    {es:'¿Dónde puedo tomar un taxi?',zh:'哪里可以打车？'},
    {es:'Perdí mi maleta. / He perdido mi equipaje.',zh:'我丢了行李'},
    {es:'¿Este autobús va al centro?',zh:'这趟公交去市中心吗？'},
    {es:'¿Cuánto tiempo tarda en llegar?',zh:'需要多长时间到达？'},
  ],
  '🛒 购物':[
    {es:'¿Cuánto cuesta esto?',zh:'这个多少钱？'},
    {es:'¿Me lo puedo probar?',zh:'我可以试一下吗？'},
    {es:'¿Tiene una talla más pequeña?',zh:'有小一号的吗？'},
    {es:'Solo estoy mirando, gracias.',zh:'我只是看看，谢谢'},
    {es:'Me lo llevo.',zh:'我要了'},
    {es:'¿Aceptan tarjeta de crédito?',zh:'可以刷卡吗？'},
    {es:'¿Me puede hacer un descuento?',zh:'能打折吗？'},
    {es:'¿Tienen esto en otro color?',zh:'有其他颜色吗？'},
  ],
  '🏥 紧急/医疗':[
    {es:'Necesito un médico.',zh:'我需要医生'},
    {es:'¿Dónde está la farmacia más cercana?',zh:'最近的药房在哪？'},
    {es:'Me duele aquí.',zh:'我这里疼'},
    {es:'¿Habla inglés o chino?',zh:'你会说英语或中文吗？'},
    {es:'Llame a una ambulancia, por favor.',zh:'请叫救护车'},
    {es:'Me han robado el bolso.',zh:'我的包被偷了'},
    {es:'¿Dónde está la comisaría?',zh:'警察局在哪？'},
    {es:'Soy alérgico a...',zh:'我对…过敏'},
  ],
  '👋 社交':[
    {es:'Mucho gusto. / Encantado.',zh:'很高兴认识你'},
    {es:'¿Cómo estás? / ¿Qué tal?',zh:'你好吗？'},
    {es:'¿De dónde eres?',zh:'你是哪里人？'},
    {es:'¿Qué te gusta hacer en tu tiempo libre?',zh:'你空闲时间喜欢做什么？'},
    {es:'Lo siento. / Perdón.',zh:'对不起'},
    {es:'No pasa nada. / No te preocupes.',zh:'没关系'},
    {es:'¡Qué bonito! / ¡Qué guay!',zh:'好漂亮！/ 好酷！'},
    {es:'¿Nos tomamos un café?',zh:'一起喝杯咖啡？'},
  ],
};

function renderScenarios(){
  var h='';
  for(var name in travelData){
    h+='<div class="scenario-card" onclick="showPhrases(\''+name+'\')"><div class="icon">'+name.slice(0,2)+'</div><h4>'+name.slice(3)+'</h4><div class="count">'+travelData[name].length+' 句</div></div>';
  }
  $('travel-scenarios').innerHTML=h;$('travel-phrases').innerHTML='';
}
function showPhrases(name){
  var phrases=travelData[name]||[];
  var h='<div class="card"><h3>'+name+'</h3><button class="btn ghost" style="margin-bottom:10px;font-size:11px" onclick="renderScenarios()">↩ 返回场景列表</button>';
  phrases.forEach(function(p){
    h+='<div class="phrase-item"><div class="es">'+p.es+'</div><div class="zh">'+p.zh+'</div><button class="play-btn" onclick="event.stopPropagation();speak(\''+p.es.replace(/'/g,"\\'")+'\')">🔊</button></div>';
  });
  h+='</div>';$('travel-phrases').innerHTML=h;
}
renderScenarios();

// ===== SENTENCE PRACTICE =====
var sentLevel=1,sentCorrect=0,sentTotal=0;

var sentenceBank={
  1:[ // L1: Fill blank - present/past tense verb
    {q:'Todos los días yo ___ (comer) a las dos.',ans:'como',hint:'comer 现在时 → como'},
    {q:'Mi hermana ___ (trabajar) en un hospital.',ans:'trabaja',hint:'trabajar 现在时 ella → trabaja'},
    {q:'Ayer nosotros ___ (ir) al supermercado.',ans:'fuimos',hint:'ir 过去时 nosotros → fuimos'},
    {q:'¿Tú ___ (tener) hermanos?',ans:'tienes',hint:'tener 现在时 tú → tienes'},
    {q:'Ellos ___ (vivir) en Madrid desde 2020.',ans:'viven',hint:'vivir 现在时 ellos → viven'},
    {q:'El año pasado yo ___ (viajar) a Perú.',ans:'viajé',hint:'viajar 过去时 yo → viajé'},
    {q:'Ella no ___ (poder) venir ayer.',ans:'pudo',hint:'poder 过去时 ella → pudo'},
    {q:'¿Qué ___ (hacer) tú el fin de semana pasado?',ans:'hiciste',hint:'hacer 过去时 tú → hiciste'},
    {q:'Nosotros ___ (estar) muy contentos con el resultado.',ans:'estamos',hint:'estar 现在时 nosotros → estamos'},
    {q:'Mis padres ___ (ser) de Guangdong.',ans:'son',hint:'ser 现在时 ellos → son'},
  ],
  2:[ // L2: Word ordering
    {q:'我每天都学西班牙语。',words:['español','Todos','estudio','los días','yo'],ans:'Todos los días yo estudio español'},
    {q:'昨天我和朋友去吃了饭。',words:['Ayer','a comer','con','fui','mis amigos'],ans:'Ayer fui a comer con mis amigos'},
    {q:'你能帮我一下吗？',words:['puedes','¿','ayudarme','?','Me'],ans:'¿Me puedes ayudar?'},
    {q:'这个周末我要去看电影。',words:['voy','al cine.','a ir','Este','fin de semana'],ans:'Este fin de semana voy a ir al cine.'},
    {q:'他不喜欢吃鱼。',words:['No','comer','le','gusta','pescado.'],ans:'No le gusta comer pescado.'},
    {q:'我学西班牙语三年了。',words:['estudiando','Llevo','años','tres','español.'],ans:'Llevo tres años estudiando español.'},
    {q:'如果你想去，我陪你去。',words:['Si','ir,','contigo.','quieres','voy'],ans:'Si quieres ir, voy contigo.'},
    {q:'到了给我打电话。',words:['llámame.','Cuando','llegues,','tú'],ans:'Cuando tú llegues, llámame.'},
  ],
  3:[ // L3: Chinese→Spanish translation
    {q:'我每天早上七点起床。',ans:'Me levanto a las siete de la mañana.',hint:'levantarse 现在时 yo → me levanto'},
    {q:'昨天我看了一部很有意思的电影。',ans:'Ayer vi una película muy interesante.',hint:'ver 过去时 yo → vi'},
    {q:'你能告诉我银行怎么走吗？',ans:'¿Me puede decir cómo llegar al banco?',hint:'问路：puede decir + cómo llegar'},
    {q:'我以前不会游泳，但现在会了。',ans:'Antes no sabía nadar, pero ahora sí.',hint:'过去不会 = no sabía, 现在会 = ahora sí'},
    {q:'等我有空了我就打电话给你。',ans:'Cuando tenga tiempo, te llamaré.',hint:'cuando + 将来 → 虚拟 tengo→tenga'},
    {q:'这东西太贵了，我不能买。',ans:'Esto es demasiado caro, no puedo comprarlo.',hint:'太…了 = demasiado, 不能买 = no puedo comprarlo'},
    {q:'他的西班牙语说得比我好。',ans:'Él habla español mejor que yo.',hint:'更好 = mejor que'},
    {q:'如果明天不下雨，我们去公园。',ans:'Si mañana no llueve, vamos al parque.',hint:'条件句：si + 现在时, 现在时'},
  ],
  4:[ // L4: Reading comprehension
    {text:'María tiene 28 años y vive en Barcelona. Todos los días se levanta a las siete, desayuna café con tostadas y va al trabajo en metro. Le gusta mucho su trabajo porque puede practicar idiomas. El año pasado viajó a México y le encantó la comida. Este verano quiere ir a Perú para visitar Machu Picchu. Dice que es su sueño desde que era niña.',
    qs:[
      {q:'¿Dónde vive María?',opts:['En Madrid','En Barcelona','En México','En Perú'],ans:1},
      {q:'¿Cómo va al trabajo?',opts:['En coche','En autobús','En metro','Andando'],ans:2},
      {q:'¿Por qué le gusta su trabajo?',opts:['Porque gana mucho','Porque puede practicar idiomas','Porque está cerca de casa','Porque viaja mucho'],ans:1},
      {q:'¿Qué quiere hacer este verano?',opts:['Ir a México','Visitar Machu Picchu','Aprender un idioma','Cambiar de trabajo'],ans:1},
    ]},
    {text:'Pedro y Ana son hermanos pero muy diferentes. A Pedro le encanta el deporte: juega al fútbol los fines de semana y nada en la piscina cada mañana. Ana prefiere quedarse en casa leyendo. Cuando eran pequeños, iban juntos al parque todos los días. Ahora que son mayores, no se ven tanto, pero siguen siendo muy unidos.',
    qs:[
      {q:'¿Qué hace Pedro los fines de semana?',opts:['Lee libros','Juega al fútbol','Ve la televisión','Viaja'],ans:1},
      {q:'¿Qué prefiere hacer Ana?',opts:['Nadar','Correr','Leer','Cocinar'],ans:2},
      {q:'¿Cómo era su relación cuando eran niños?',opts:['No se hablaban','Iban juntos al parque','Vivían en diferentes ciudades','Estudiaban juntos'],ans:1},
      {q:'¿Cómo es su relación ahora?',opts:['Ya no se hablan','Siguen siendo muy unidos','Viven juntos','Trabajan juntos'],ans:1},
    ]},
  ]
};

function setLevel(l){
  sentLevel=l;
  [1,2,3,4].forEach(function(i){var b=$('lvl-btn-'+i);b.classList.toggle('on',i===l)});
  renderSentence();
}
function renderSentence(){
  var bank=sentenceBank[sentLevel]||[],items=bank.slice();
  for(var i=items.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=items[i];items[i]=items[j];items[j]=t;}
  items=items.slice(0,sentLevel===4?1:3);
  var h='';
  items.forEach(function(item,idx){
    if(sentLevel===1){
      var parts=item.q.split('___');
      h+='<div class="sentence-box" id="sq-'+idx+'"><div class="prompt">'+parts[0]+'<span class="blank" id="blank-'+idx+'">______</span>'+parts[1]+'</div>'+
        '<input type="text" id="sinput-'+idx+'" placeholder="输入动词变位..." onkeydown="if(event.key===\'Enter\')checkSent('+idx+')">'+
        '<div class="feedback" id="sfb-'+idx+'"></div>'+
        '<div class="btn-row"><button class="btn accent" onclick="checkSent('+idx+')">✅ 检查</button></div></div>';
    }else if(sentLevel===2){
      h+='<div class="sentence-box" id="sq-'+idx+'"><div class="prompt">'+item.q+'</div>'+
        '<div class="word-chips" id="chips-'+idx+'"></div>'+
        '<div class="word-pool" id="pool-'+idx+'"></div>'+
        '<div class="feedback" id="sfb-'+idx+'"></div>'+
        '<div class="btn-row"><button class="btn accent" onclick="checkSent('+idx+')">✅ 检查</button><button class="btn ghost" onclick="undoWords('+idx+')">↩ 撤销</button></div></div>';
      renderWordOrder(idx,item);
    }else if(sentLevel===3){
      h+='<div class="sentence-box" id="sq-'+idx+'"><div class="prompt">🇨🇳 '+item.q+'</div>'+
        '<textarea id="sinput-'+idx+'" placeholder="输入西班牙语翻译..."></textarea>'+
        '<div class="feedback" id="sfb-'+idx+'"></div>'+
        '<div class="btn-row"><button class="btn accent" onclick="checkSent('+idx+')">✅ 检查</button></div></div>';
    }else if(sentLevel===4){
      h+='<div class="card" id="sq-'+idx+'"><h3>📖 阅读理解</h3>'+
        '<div class="reading-passage">'+item.text+'</div>';
      item.qs.forEach(function(q,qi){
        h+='<div style="margin:10px 0"><p style="font-size:12px;font-weight:600;margin-bottom:4px">'+(qi+1)+'. '+q.q+'</p>';
        q.opts.forEach(function(o,oi){
          h+='<button class="q-opt-btn" id="ropt-'+idx+'-'+qi+'-'+oi+'" onclick="pickROpt('+idx+','+qi+','+oi+')">'+o+'</button>';
        });
        h+='</div>';
      });
      h+='<div class="feedback" id="sfb-'+idx+'"></div>'+
        '<div class="btn-row"><button class="btn accent" onclick="checkReading('+idx+')">✅ 检查</button></div></div>';
    }
  });
  $('sent-area').innerHTML=h||'<div class="card"><p style="text-align:center;color:var(--text3)">暂无题目</p></div>';
}

// Word ordering state
var wordState={};
function renderWordOrder(idx,item){
  wordState[idx]={words:item.words.slice(),chips:[],ans:item.ans};
  var pool=item.words.slice();
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
  wordState[idx].pool=pool;
  updateWordUI(idx);
}
function updateWordUI(idx){
  var st=wordState[idx];if(!st)return;
  $('chips-'+idx).innerHTML=st.chips.map(function(w,i){return '<span class="word-chip" onclick="removeWord('+idx+','+i+')">'+w+'</span>'}).join('');
  $('pool-'+idx).innerHTML=st.pool.map(function(w,i){return '<span class="word-chip" onclick="addWord('+idx+','+i+')">'+w+'</span>'}).join('');
}
function addWord(idx,pi){
  var st=wordState[idx];if(!st)return;
  st.chips.push(st.pool[pi]);st.pool.splice(pi,1);updateWordUI(idx);
}
function removeWord(idx,ci){
  var st=wordState[idx];if(!st)return;
  st.pool.push(st.chips[ci]);st.chips.splice(ci,1);updateWordUI(idx);
}
function undoWords(idx){
  var st=wordState[idx];if(!st)return;
  st.chips.forEach(function(w){st.pool.push(w)});st.chips=[];updateWordUI(idx);
}

// Reading state
var readingPicked={};
function pickROpt(idx,qi,oi){
  if(!readingPicked[idx])readingPicked[idx]={};
  if(readingPicked[idx][qi]!==undefined)return;
  readingPicked[idx][qi]=oi;
  document.querySelectorAll('#ropt-'+idx+'-'+qi+'-'+oi).forEach(function(b){b.classList.add('picked')});
}

// Check
function checkSent(idx){
  var bank=sentenceBank[sentLevel]||[];
  if(sentLevel===1){
    var input=($('sinput-'+idx)?$('sinput-'+idx).value.trim():'').toLowerCase();
    var correct=bank[0]?null:''; // Need to find the correct item
    // Items are shuffled, need to match by prompt
    var el=$('sq-'+idx),prompt=el?el.querySelector('.prompt').textContent:'',fb=$('sfb-'+idx);
    // Find matching item
    var found=null;bank.forEach(function(item){if(item.q.indexOf(prompt.split('______')[0].trim())>=0)found=item});
    if(!found)return;
    sentTotal++;
    if(input===found.ans){fb.className='feedback show ok';fb.textContent='✅ 正确！'+found.hint;sentCorrect++}else{fb.className='feedback show err';fb.textContent='❌ 正确答案：'+found.ans+' — '+found.hint}
  }else if(sentLevel===2){
    var st=wordState[idx];if(!st)return;
    var built=st.chips.join(' '),fb=$('sfb-'+idx);
    sentTotal++;
    if(built===st.ans){fb.className='feedback show ok';fb.textContent='✅ 正确！';sentCorrect++;$('chips-'+idx).classList.add('done')}else{fb.className='feedback show err';fb.textContent='❌ 正确答案：'+st.ans}
  }else if(sentLevel===3){
    var input=($('sinput-'+idx)?$('sinput-'+idx).value.trim():'').toLowerCase(),fb=$('sfb-'+idx);
    var el=$('sq-'+idx),prompt=el?el.querySelector('.prompt').textContent.replace('🇨🇳 ','').trim():'';
    var found=null;bank.forEach(function(item){if(item.q===prompt)found=item});
    if(!found)return;
    sentTotal++;
    var ans=found.ans.toLowerCase().replace(/[¿?¡!.,]/g,'').trim();
    if(input===ans){fb.className='feedback show ok';fb.textContent='✅ 正确！';sentCorrect++}else{fb.className='feedback show err';fb.textContent='❌ 参考答案：'+found.ans+' — '+found.hint}
  }
  $('sent-score').textContent=sentTotal;$('sent-correct').textContent=sentCorrect;
}

function checkReading(idx){
  var bank=sentenceBank[4]||[];
  // Find item matching the displayed passage
  var el=$('sq-'+idx),passageText=el?el.querySelector('.reading-passage').textContent:'';
  var found=null;bank.forEach(function(item){if(passageText.indexOf(item.text.substring(0,20))>=0)found=item});
  if(!found)return;
  var score=0;
  found.qs.forEach(function(q,qi){
    if(readingPicked[idx]&&readingPicked[idx][qi]===q.ans)score++;
    document.querySelectorAll('#ropt-'+idx+'-'+qi+'-'+q.ans).forEach(function(b){b.classList.add('ok')});
  });
  sentTotal++;sentCorrect+=score===found.qs.length?1:0;
  var fb=$('sfb-'+idx);
  fb.className='feedback show '+(score===found.qs.length?'ok':'err');
  fb.textContent=score+'/'+found.qs.length+' 正确'+(score===found.qs.length?' ✅':'');
  $('sent-score').textContent=sentTotal;$('sent-correct').textContent=sentCorrect;
}

setLevel(1);
</script>
